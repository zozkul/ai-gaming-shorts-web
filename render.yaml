services:
  - type: web
    name: ai-gaming-shorts-backend
    runtime: python
    rootDir: backend
    buildCommand: apt-get install -y ffmpeg && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
